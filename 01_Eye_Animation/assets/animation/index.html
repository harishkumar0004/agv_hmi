            <line class="whisker" x1="78" y1="276" x2="-30" y2="302" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.75"></line>
            <line class="whisker" x1="506" y1="248" x2="614" y2="220" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.75"></line>
            <line class="whisker" x1="506" y1="262" x2="614" y2="262" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.75"></line>
            <line class="whisker" x1="506" y1="276" x2="614" y2="302" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.75"></line>
            <circle cx="120" cy="230" r="36" fill="#ff6b35" opacity="0.13"></circle>

          <g class="face-layer face-sleepy" data-face="sleepy">
            <rect width="584" height="355" fill="url(#sleepyBgGrad)" rx="42"></rect>

            <g class="eye-group eye-left">
              <circle cx="180" cy="158" r="118" fill="white" opacity="0.9"></circle>
              <circle cx="180" cy="158" r="76" fill="#6a6aaa"></circle>

                <circle cx="180" cy="166" r="48" fill="#05050a"></circle>

                <circle cx="163" cy="185" r="8" fill="white" opacity="0.4"></circle>
              </g>
              <rect x="62" y="40" width="236" height="146" fill="#000005" clip-path="url(#eyeClipL)"></rect>

              <rect class="blink-lid lid-left" x="62" y="40" width="236" height="0" fill="#000005" clip-path="url(#eyeClipL)"></rect>

            <g class="eye-group eye-right">
              <circle cx="404" cy="158" r="118" fill="white" opacity="0.9"></circle>

                <circle cx="404" cy="166" r="48" fill="#05050a"></circle>

            <line class="whisker" x1="80" y1="280" x2="-18" y2="300" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.5"></line>

        </svg>

        <div class="assignment-panel" id="assignmentPanel" aria-hidden="true">
          <header class="ap-header">
            <button type="button" class="ap-back" id="apBack" aria-label="Back">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
            </button>
            <h2 class="ap-title" id="apTitle">New Task</h2>
            <span class="ap-spacer" aria-hidden="true"></span>
          </header>

          <div class="ap-body">
            <section class="ap-step is-active" data-step="type">
              <p class="ap-subtitle">What would you like the robot to do?</p>
              <div class="ap-grid">
                <button type="button" class="ap-tile" data-task-type="food">
                  <span class="ap-tile-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4 2v7a2 2 0 002 2h0a2 2 0 002-2V2"></path>
                      <path d="M6 11v11"></path>
                      <path d="M18 2c-1.8 0-3 2.5-3 5.5S16.2 12 18 12v10"></path>
                    </svg>
                  </span>
                  <span class="ap-tile-label">Food &amp; Beverage</span>
                </button>
                <button type="button" class="ap-tile" data-task-type="item">
                  <span class="ap-tile-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M3 8l9-5 9 5-9 5-9-5z"></path>
                      <path d="M3 8v9l9 5 9-5V8"></path>
                      <path d="M12 13v9"></path>
                    </svg>
                  </span>
                  <span class="ap-tile-label">Item / Amenity</span>
                </button>
                <button type="button" class="ap-tile" data-task-type="housekeeping">
                  <span class="ap-tile-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M20 3l-8.5 8.5"></path>
                      <path d="M9 14l-4.5 4.5"></path>
                      <path d="M6 11.5L2.5 19 10 15.5"></path>
                      <path d="M9 14l3 3"></path>
                    </svg>
                  </span>
                  <span class="ap-tile-label">Housekeeping</span>
                </button>
                <button type="button" class="ap-tile" data-task-type="other">
                  <span class="ap-tile-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="5" y="4" width="14" height="17" rx="2"></rect>
                      <rect x="9" y="2" width="6" height="4" rx="1"></rect>
                      <path d="M9 11h6"></path>
                      <path d="M9 15h6"></path>
                    </svg>
                  </span>
                  <span class="ap-tile-label">Other Task</span>
                </button>
              </div>
            </section>

            <section class="ap-step" data-step="details">
              <p class="ap-subtitle" id="apDetailsSubtitle">Delivery details</p>

              <label class="ap-field">
                <span>Room Number</span>
                <select class="ap-select" id="apRoomSelect">
                  <option value="">Select room&#8230;</option>
                  <option value="__custom">Other / Manual entry</option>
                </select>
              </label>

              <label class="ap-field" id="apCustomRoomField" hidden>
                <span>Enter Room Number</span>
                <input type="text" class="ap-input" id="apCustomRoom" inputmode="numeric" placeholder="e.g. 614">
              </label>

              <label class="ap-field">
                <span>Notes / Items</span>
                <textarea class="ap-textarea" id="apNotes" rows="2" placeholder="e.g. 2 towels, toothpaste"></textarea>
              </label>

              <button type="button" class="ap-primary" id="apConfirmBtn" disabled>Assign Task</button>
            </section>

            <section class="ap-step" data-step="confirm">
              <div class="ap-check" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"></path></svg>
              </div>
              <p class="ap-confirm-title">Task Assigned</p>
              <p class="ap-confirm-detail" id="apConfirmDetail">Room &#8212; </p>
              <button type="button" class="ap-primary" id="apDoneBtn">Done</button>
            </section>
          </div>
        </div>
      </div>
    </section>

    <aside class="debug-panel" id="debugPanel" aria-label="Emotion debug controls">
      <button type="button" data-emotion-button="normal">Normal</button>
      <button type="button" data-emotion-button="happy">Happy</button>
      <button type="button" data-emotion-button="angry">Angry</button>
      <button type="button" data-emotion-button="sad">Sad</button>
      <button type="button" data-emotion-button="excited">Excited</button>
      <button type="button" data-emotion-button="sleepy">Sleepy</button>
    </aside>
  </main>

  <script src="emotions/normal.js"></script>
  <script src="emotions/happy.js"></script>
  <script src="emotions/angry.js"></script>
  <script src="emotions/sad.js"></script>
  <script src="emotions/excited.js"></script>
  <script src="emotions/sleepy.js"></script>
  <script src="script.js"></script>
  <script src="assignment.js"></script>
</body>
</html>
